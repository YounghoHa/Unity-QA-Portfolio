name: Import resolution QA video

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/import-resolution-video.yml"

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download QA video
        run: |
          mkdir -p Images/videos
          curl -L --fail --retry 3             "https://github.com/user-attachments/assets/30602093-631b-4fdb-905a-ed178d6d7c94"             -o Images/videos/04-resolution-setting-fail.mp4
          test "$(stat -c%s Images/videos/04-resolution-setting-fail.mp4)" -gt 100000

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/videos/04-resolution-setting-fail.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "evidence: add resolution setting fail video"
          git push
